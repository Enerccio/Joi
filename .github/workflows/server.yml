# Builds the server artifacts: the WAR, the extension JARs (the model providers Anthropic Claude, Google Gemini and xAI Grok, and
# Marginalia's books) and
# the Docker image (linux/amd64 + linux/arm64).
#
# Tests run in test.yml, this workflow only checks that everything builds and starts.
#
# Published on master and v* tags (not for pull requests):
#   ghcr.io/<owner>/joi:edge                    latest master
#   ghcr.io/<owner>/joi:<version>, :<major>.<minor>, :latest     v* tags
# Attached to the GitHub release of a v* tag: joi-server-<version>.war and joi-extension-<name>-<version>.jar.
#
# The image has no extensions inside: they are loaded from the extensions folder of the data folder (Administration -> Extensions).
# The linux/arm64 image is made without Blender (blender.org builds it for x86_64 only, see the Dockerfile).

name: Server

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - 'joi-protocol/**'
      - 'joi-server/**'
      - 'joi-extensions/**'
      - 'marginalia'
      - 'pom.xml'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      - 'tools/version_from_tag.sh'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  MAVEN_ARGS: '-B -ntp'

jobs:
  build:
    name: WAR and extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the platform is the Marginalia submodule
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Take the version from the tag
        # a v* tag is the release version: Joi's POMs get it before the build (tools/version_from_tag.sh); other builds keep pom.xml's
        run: tools/version_from_tag.sh

      - name: Install the parent POMs
        # Joi's root POM and the platform's parent (marginalia/pom.xml): the modules below refer to them
        run: |
          mvn -N install
          mvn -N install -f marginalia/pom.xml

      - name: Build and install the server
        # install, not package: the extensions compile against the platform in the local repository. -am builds the platform
        # (marginalia/marginalia/platform) and the protocol first; -Pproduction builds the frontend bundle into the WAR
        run: mvn -DskipTests -Pproduction install -pl joi-server -am

      - name: Build the extensions
        run: mvn -DskipTests package -pl joi-extensions/anthropic,joi-extensions/google-genai,joi-extensions/grok,joi-extensions/marginalia-books

      - name: Collect artifacts
        run: |
          mkdir dist
          cp joi-server/target/joi-server-*.war dist/
          # the bundle is named by its artifact (grok-<version>.jar): in a release it needs to say whose it is
          for jar in joi-extensions/*/target/*.jar; do
            cp "$jar" "dist/joi-extension-$(basename "$jar")"
          done
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joi-server
          path: dist/*
          if-no-files-found: error
          # the WAR is already compressed
          compression-level: 0
          retention-days: 14

  docker:
    name: Docker ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Take the version from the tag
        # the image builds with its own JDK; the script needs only Python
        run: tools/version_from_tag.sh

      - name: Image name
        # registry references must be lower case, the repository name isn't
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        # each platform builds natively (the Maven stage is slow under emulation); the image is loaded for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: joi-smoke
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Smoke test
        # the container must start and answer /health (the application is up and the database answers), with the data folder as a
        # bind mount created by Docker (root-owned, the entrypoint fixes the owner)
        run: |
          mkdir "$RUNNER_TEMP/data"
          docker run -d --name smoke -p 18080:8080 -v "$RUNNER_TEMP/data:/var/joi/data" joi-smoke
          for i in $(seq 1 240); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/health")" = "200" ]; then
              echo "Joi is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Joi did not start"
          docker logs smoke
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        # the tags are put on the multi-platform manifest by the publish job
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Image name
        # registry references must be lower case, the repository name isn't
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # both substitutions expand to several arguments on purpose
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: joi-server
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
