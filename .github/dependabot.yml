# Dependency updates, weekly, grouped so a week brings a few pull requests and not one per library.
#
# Maven: the root pom.xml is the parent of the modules, one entry covers them. The platform's versions (Vaadin, Spring, Jetty ...)
# follow Marginalia's POM (see the properties of pom.xml), so a bump of those belongs to a bump of the submodule: those groups are
# kept apart so that a mixed set is easy to see. The submodule itself is bumped on purpose (MARGINALIA.md), not by Dependabot.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Vaadin, Spring, Jetty move together, a mixed set does not start
      vaadin:
        patterns: ['com.vaadin*', 'com.vaadin:*']
      spring:
        patterns: ['org.springframework*']
      jetty:
        patterns: ['org.eclipse.jetty*']
      maven-plugins:
        patterns: ['org.apache.maven.plugins:*', 'org.codehaus.mojo:*', 'org.jacoco:*']
      other-patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # the base images of the Docker image (maven, jetty, alpine)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
