openapi: 3.1.0
info:
  title: Joi API
  version: "1.14"
  description: |
    The HTTP API of a Joi server for nodes and other clients: the assistants of the user, chat with one of them,
    answered in text and speech, and the body she is in with the files to show it (`.joim`, `.joia`). The message shapes are the JSON Schemas in `schemas/` (the source of truth); the Java
    records of `joi-protocol` follow them.

    **Auth.** `GET /api/v1` says what the server offers (`auth.methods`):
    - `token`: a token the user created in User Settings → Access, sent as `Authorization: Bearer joi_...`.
    - `oauth`: the device authorization grant (RFC 8628). The device asks `/oauth/device_authorization` for a code,
      shows it, the user approves it in the server's UI, the device polls `/oauth/token`. The access token
      (`joia_...`) is sent like a token; it expires, and `refresh_token` gives a new pair.
    - `none`: no credentials at all; the server acts as one configured user. Only for development and localhost
      setups, turned on in the server's configuration (`joi.api.no-auth`).

    The administrator chooses which of `token` and `oauth` are offered. A call without valid credentials gets 401.

    **Administration** (since 1.13). `/api/v1/admin/update` and `/api/v1/admin/extensions` need a token with the scope
    `update` or `extensions` (`AdminScope`). Only an administrator gives a token these scopes (User Settings → Access →
    Create token), and they work only while the owner is one: a call without the scope gets 403 `forbidden`. An OAuth
    device, the local node and `none` never have them. `GET /api/v1/me` lists the scopes of the call.

    **Versioning.** `major.minor`: a minor version only adds fields, calls and stream events, and clients ignore what
    they do not know. A new major version gets a new path.
servers:
  - url: http://localhost:8080
paths:
  /api/v1:
    get:
      summary: What the server is and how to authenticate
      security: [ ]
      responses:
        "200":
          description: The server
          content:
            application/json:
              schema: { $ref: "schemas/ServerInfo.schema.json" }
  /api/v1/me:
    get:
      summary: Whom the call acts for
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "schemas/Me.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/jois:
    get:
      summary: The assistants of the user, by name
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema: { $ref: "schemas/JoiList.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/jois/{id}:
    get:
      summary: An assistant
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
      responses:
        "200":
          description: The assistant
          content:
            application/json:
              schema: { $ref: "schemas/JoiInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/jois/{id}/chat:
    get:
      summary: Her history, the latest exchanges first (since 1.3)
      description: |
        Her latest exchanges, oldest first: what the user said (or the kind of the event she reacted to) and her
        reply. A client shows them when it starts, so the chat goes on where it was. `more` says there are earlier
        ones: ask again with `before`, the id of the first one given.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - name: limit
          in: query
          required: false
          description: How many, 1 to 200 (default 50)
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          required: false
          description: The id of a message (ChatEntry.id); the ones before it are given
          schema: { type: string }
      responses:
        "200":
          description: Her exchanges, oldest first
          content:
            application/json:
              schema: { $ref: "schemas/ChatHistory.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Say something to her; she answers in text and speech
      description: |
        The message is stored in her history and the prompt is built from it. Calls to one assistant are answered one
        after another.

        **Whole reply** (default): one `ChatReply` with the text and, when `speak` and she has a voice, the audio of
        the whole reply. A failed speech still gives the text, with `speechError`.

        **Streamed** (`"stream": true` or `Accept: text/event-stream`): server-sent events, `event: <name>` with
        `data: <JSON>`, in this order: `reasoning` and `text` pieces (`TextDelta`) while the model writes; `reply`
        (`ChatReply` without audio) once the text is stored; `audio` pieces (`AudioChunk`, a sentence or a few each,
        every one a whole file) while she speaks; `done` (`Done`). `error` (`ApiError`) ends a stream that failed.
        Lines starting with `:` keep the connection alive.

        Why both: the speech starts once the text is whole and stored, and a streamed reply is spoken piece by piece,
        the first sentence first, so a voice node starts playing after the first piece instead of after the whole
        reply. A simple client takes the whole reply.

        **Images** (since 1.11): `images` lists the ids `POST /api/v1/jois/{id}/images` gave (at most 4, each once);
        she looks at them with the words, and the words may be empty then. Whether she can is `JoiInfo.images`; when
        she cannot, the call is answered `409 no_vision` and nothing is stored, so the client says so and does not
        drop the image silently.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/ChatRequest.schema.json" }
      responses:
        "200":
          description: Her reply, whole or streamed
          content:
            application/json:
              schema: { $ref: "schemas/ChatReply.schema.json" }
            text/event-stream:
              schema:
                type: string
                description: "Events: reasoning, text (TextDelta), reply (ChatReply), audio (AudioChunk), done (Done), error (ApiError)"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`no_model`: she has no chat model set up; `no_vision` (since 1.11): images were sent and neither her chat model nor a model of the user that takes images can look at them"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
        "502":
          description: "`model_failed`: the model did not answer"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
  /api/v1/jois/{id}/images:
    post:
      summary: Give her an image to look at with the next message (since 1.11)
      description: |
        The body is the image itself (`Content-Type: image/jpeg`, `image/png`, `image/gif` or `image/bmp`; the type sent is
        not trusted, the content is), at most 20 MB and 80 megapixels. It is streamed to the disk, never held in memory, so a
        client streams it too. The server decodes it, scales it down so that its longest side is at most 1568 pixels and keeps it
        as JPEG: those are the bytes the model gets, and what `GET /api/v1/images/{id}` gives back. The answer is the id to put
        in `ChatRequest.images` (or `Say.images` on the node WebSocket). An image that no message used within an hour is deleted.
        A phone sends HEIC as JPEG (the system converts it); WebP is read.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The image as kept
          content:
            application/json:
              schema: { $ref: "schemas/ImageUpload.schema.json" }
        "400":
          description: "`bad_image`: not an image the server reads, or too many pixels"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: "`bad_image`: larger than 20 MB"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
  /api/v1/images/{id}:
    get:
      summary: An image of the user, as it is kept (since 1.11)
      description: |
        The JPEG of an image sent with a message (`ChatEntry.images`) or uploaded (`ImageUpload.id`); only the user's own. The
        file never changes, so the hash is its ETag and a client caches it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "304": { description: The client has it }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/jois/{id}/body:
    get:
      summary: The body she is in, the state of its parts and its animations (since 1.1)
      description: |
        Her body now: its models (the full one and the one for the Looking Glass), each with its `.joim` to download;
        the parts of the full model that can be switched, each in the state the body is in; how she looks; and the
        animations the body plays, with their `.joia` (the animations and their clips, see `joia.md`).

        A client caches the files by their `sha256` and downloads one again only when it changed. A file whose
        `current` is false is older than what is set up: it is written again when the user exits its dialog.

        **Profiles** (since 1.12). She has a profile per place (home, work) with its own body and state of the parts,
        and the user assigns each node to one. `node` is the stable id the node says hello with: the answer is the body of
        the profile that node is in. Without it (or for a node that is assigned to none) it is the default profile's body.
        The server sends the `event` `body` only to the nodes of the profile that changed.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - name: node
          in: query
          required: false
          description: The id of the node (its `hello.nodeId`), for the body of its profile (since 1.12)
          schema: { type: string }
      responses:
        "200":
          description: Her body
          content:
            application/json:
              schema: { $ref: "schemas/BodyInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_found`: no such assistant; `no_body`: she is in no body"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
  /api/v1/jois/{id}/auto-approved:
    get:
      summary: The tools approved ahead of time for her (since 1.7)
      description: |
        "Approve all of this tool": the tools whose tasks are approved without asking. The server keeps it (set in its UI or
        by `approve` with `always`); a tool the user denies at any level stays denied.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema: { $ref: "schemas/AutoApprovalList.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/jois/{id}/auto-approved/{tool}:
    put:
      summary: Approve a tool ahead of time: its tasks are approved without asking (since 1.7)
      description: |
        The tasks of the tool that wait now are approved, and the later ones when they are made. A tool the user denies at any
        level stays denied. A tool that is approved already is as it was (no error). A note in her conversation says it.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - name: tool
          in: path
          required: true
          description: The tool's name (`AutoApproval.tool`)
          schema: { type: string }
      responses:
        "200":
          description: The tools approved now
          content:
            application/json:
              schema: { $ref: "schemas/AutoApprovalList.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Take back the approval of a tool: its tasks ask again (since 1.7)
      description: A tool that was not approved is as it was (no error). A note in her conversation says it.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - name: tool
          in: path
          required: true
          description: The tool's name (`AutoApproval.tool`)
          schema: { type: string }
      responses:
        "200":
          description: The tools approved now
          content:
            application/json:
              schema: { $ref: "schemas/AutoApprovalList.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/jois/{id}/tasks:
    get:
      summary: Her tasks, the newest first (since 1.6)
      description: |
        The tasks she started with the tools of the server (`web_search`, `fetch_page`): they run after her reply with the
        stronger model, or wait (`waiting`) until the user approves them, as the tool's permission says (the assistant's,
        else the user's, else the administrator's; set in the server's UI). The transcript is not in the list.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - name: status
          in: query
          required: false
          description: Only the tasks in this status (`queued`, `running`, `waiting`, `done`, `failed`, `cancelled`)
          schema: { type: string }
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema: { $ref: "schemas/TaskList.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/jois/{id}/tasks/{task}:
    get:
      summary: A task with its transcript (since 1.6)
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - { $ref: "#/components/parameters/TaskId" }
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "schemas/TaskInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/jois/{id}/tasks/{task}/approve:
    post:
      summary: Allow a task that waits (since 1.6)
      description: |
        It is queued and runs when her turns are done. With `always` (since 1.7) the user also approves the tool ahead of
        time: the tasks of it that wait now are approved, and the later ones are approved when they are made. The
        server keeps that, and says so in the conversation; a deny of the tool at any level still wins.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - { $ref: "#/components/parameters/TaskId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "schemas/TaskApproval.schema.json" }
      responses:
        "200":
          description: The task as it is now
          content:
            application/json:
              schema: { $ref: "schemas/TaskInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/jois/{id}/tasks/{task}/deny:
    post:
      summary: Do not allow a task that waits (since 1.6)
      description: The task is `cancelled` with the reason as its `error`, and she is told.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - { $ref: "#/components/parameters/TaskId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "schemas/TaskDenial.schema.json" }
      responses:
        "200":
          description: The task as it is now
          content:
            application/json:
              schema: { $ref: "schemas/TaskInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/jois/{id}/tasks/{task}/cancel:
    post:
      summary: Stop a task that has not ended (since 1.6)
      description: At once when it has not started, between its steps when it runs. She is told.
      parameters:
        - { $ref: "#/components/parameters/JoiId" }
        - { $ref: "#/components/parameters/TaskId" }
      responses:
        "200":
          description: The task as it is now
          content:
            application/json:
              schema: { $ref: "schemas/TaskInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/models/{id}/joim:
    get:
      summary: The .joim of a model of the user (since 1.1)
      description: The model's VRM and what was decided on it, as `joim.md` describes; streamed.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the model (BodyModel.id)
          schema: { type: string }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/File" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_found`: no such model, or it has no .joim yet"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
  /api/v1/bodies/{id}/joia:
    get:
      summary: The .joia of a body's animations (since 1.1)
      description: The animations the body plays with their clips, as `joia.md` describes; streamed.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the body (BodyInfo.id)
          schema: { type: string }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/File" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_found`: no such body, or it has no .joia"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
  /api/v1/admin/update:
    get:
      summary: The update of the installation (since 1.13, scope update)
      description: What the watcher outside the server (a built image or a checkout) last wrote about the update.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema: { $ref: "schemas/UpdateStatus.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Ask for an update of the installation (since 1.13, scope update)
      description: |
        Writes the request the watcher takes; the server restarts when the update runs. Answers the status with
        `requested` set.
      responses:
        "202":
          description: Asked for
          content:
            application/json:
              schema: { $ref: "schemas/UpdateStatus.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`conflict`: no watcher runs, or an update runs or was asked for already"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
  /api/v1/admin/update/log:
    get:
      summary: The log of the last update (since 1.13, scope update)
      parameters:
        - { $ref: "#/components/parameters/LogBytes" }
      responses:
        "200": { $ref: "#/components/responses/Log" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/extensions:
    get:
      summary: The extensions of the server (since 1.13, scope extensions)
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema: { $ref: "schemas/ExtensionList.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/NoExtensions" }
  /api/v1/admin/extensions/{jar}:
    get:
      summary: An extension (since 1.13, scope extensions)
      parameters:
        - { $ref: "#/components/parameters/Jar" }
      responses:
        "200":
          description: The extension
          content:
            application/json:
              schema: { $ref: "schemas/ExtensionInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoExtensions" }
    put:
      summary: Install an extension, or replace the one of this JAR (since 1.13, scope extensions)
      description: |
        The body is the JAR (any content type, up to 256 MB), streamed to the disk. The server checks that it fits
        its version before it loads it; one that does not is refused with 422 and nothing changes.
      parameters:
        - { $ref: "#/components/parameters/Jar" }
      requestBody:
        required: true
        content:
          application/java-archive:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Installed
          content:
            application/json:
              schema: { $ref: "schemas/ExtensionInfo.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: "`bad_request`: the JAR is larger than 256 MB"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
        "422":
          description: "`extension_rejected`: it does not fit this version of the server; the message holds the report"
          content:
            application/json:
              schema: { $ref: "schemas/ApiError.schema.json" }
        "503": { $ref: "#/components/responses/NoExtensions" }
    delete:
      summary: Remove an extension (since 1.13, scope extensions)
      parameters:
        - { $ref: "#/components/parameters/Jar" }
      responses:
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoExtensions" }
  /api/v1/admin/extensions/{jar}/stop:
    post:
      summary: Stop an extension; it stays stopped after a restart (since 1.13, scope extensions)
      parameters:
        - { $ref: "#/components/parameters/Jar" }
      responses:
        "200":
          description: The extension
          content:
            application/json:
              schema: { $ref: "schemas/ExtensionInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoExtensions" }
  /api/v1/admin/extensions/{jar}/start:
    post:
      summary: Start a stopped extension (since 1.13, scope extensions)
      parameters:
        - { $ref: "#/components/parameters/Jar" }
      responses:
        "200":
          description: The extension
          content:
            application/json:
              schema: { $ref: "schemas/ExtensionInfo.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoExtensions" }
  /api/v1/admin/extensions/{jar}/log:
    get:
      summary: The log of an extension, its end (since 1.13, scope extensions)
      parameters:
        - { $ref: "#/components/parameters/Jar" }
        - { $ref: "#/components/parameters/LogBytes" }
      responses:
        "200": { $ref: "#/components/responses/Log" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoExtensions" }
  /oauth/device_authorization:
    post:
      summary: A device asks for its codes (RFC 8628, 3.1)
      security: [ ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ client_id ]
              properties:
                client_id: { type: string, description: "Any name of the client; public clients, no secret" }
                client_name: { type: string, description: "The name the user sees when approving, default client_id" }
                pairing_offer:
                  type: string
                  description: |
                    The offer of a QR code the server's UI showed (Pair a phone, `joi://pair?server=...&offer=...`), since 1.9. The screen
                    that showed it approves this device by itself, so the user types no code; the device polls `/oauth/token` as always
                    (at once, the first time). An offer that is unknown, expired or closed is a 400 `invalid_request`.
      responses:
        "200":
          description: The codes
          content:
            application/json:
              schema: { $ref: "schemas/DeviceAuthorization.schema.json" }
        "400": { $ref: "#/components/responses/OAuthError" }
        "503": { $ref: "#/components/responses/OAuthError" }
  /oauth/token:
    post:
      summary: Poll for the tokens of a device, or refresh them (RFC 8628, 3.4; RFC 6749, 6)
      security: [ ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ grant_type ]
              properties:
                grant_type:
                  type: string
                  enum: [ "urn:ietf:params:oauth:grant-type:device_code", refresh_token ]
                device_code: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
      responses:
        "200":
          description: The tokens
          content:
            application/json:
              schema: { $ref: "schemas/TokenResponse.schema.json" }
        "400": { $ref: "#/components/responses/OAuthError" }
        "503": { $ref: "#/components/responses/OAuthError" }
  /oauth/local:
    post:
      summary: The token of a node on the server's own machine, with no key and no login (since 1.8)
      description: |
        Answered only on the server's local socket: a Unix domain socket in the data folder, which the desktop app opens
        (`joi.api.local-socket`). Whoever can open it can read the data folder, so the socket is the proof; a call that arrives any
        other way (TCP, a proxy) is answered `404 invalid_request`, as an unknown path. The token acts for the configured user of no
        auth (`joi.api.no-auth-user`), else the first administrator, and works whatever the administrator offers to other clients
        (API access). It has no refresh token: when it expires, ask again. The same `client_id` gets a new token in place of the old
        one (the old one stops working), so a node keeps one entry in the user's list of devices.
      security: [ ]
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id: { type: string, description: "Any stable name of the client, default joi-node" }
                client_name: { type: string, description: "The name in the user's list of devices, default client_id" }
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema: { $ref: "schemas/LocalToken.schema.json" }
        "404": { $ref: "#/components/responses/OAuthError" }
        "409":
          description: "`no_user`: nobody has an account yet, the first one is made in the web UI"
          content:
            application/json:
              schema: { $ref: "schemas/OAuthError.schema.json" }
  /.well-known/oauth-authorization-server:
    get:
      summary: The OAuth metadata (RFC 8414)
      security: [ ]
      responses:
        "200":
          description: The metadata
          content:
            application/json:
              schema: { $ref: "schemas/OAuthMetadata.schema.json" }
        "404":
          description: OAuth is not offered
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A token (joi_...) or an OAuth access token (joia_...)
  parameters:
    JoiId:
      name: id
      in: path
      required: true
      description: The id of the assistant (JoiSummary.id)
      schema: { type: string }
    TaskId:
      name: task
      in: path
      required: true
      description: The id of the task (TaskInfo.id)
      schema: { type: string }
    Jar:
      name: jar
      in: path
      required: true
      description: The name of the extension's JAR file (ExtensionInfo.jar), ending in .jar
      schema: { type: string }
    LogBytes:
      name: bytes
      in: query
      required: false
      description: How much of the end of the log, in bytes (default 65536, at most 4194304)
      schema: { type: integer, minimum: 1, maximum: 4194304, default: 65536 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The ETag (the quoted sha256) of the copy the client has; 304 when it is still the file
      schema: { type: string }
  responses:
    File:
      description: The file, with its ETag (the quoted sha256) and a Content-Disposition with its name
      headers:
        ETag: { schema: { type: string } }
        Content-Disposition: { schema: { type: string } }
      content:
        application/x-joi-model:
          schema: { type: string, format: binary, description: "A .joim" }
        application/x-joi-animations:
          schema: { type: string, format: binary, description: "A .joia" }
    NotModified:
      description: The client's copy is the file
    Unauthorized:
      description: "`unauthorized`: no valid credentials"
      content:
        application/json:
          schema: { $ref: "schemas/ApiError.schema.json" }
    Forbidden:
      description: "`forbidden`: the token does not have the scope, or its owner is not an administrator"
      content:
        application/json:
          schema: { $ref: "schemas/ApiError.schema.json" }
    NoExtensions:
      description: "`unavailable`: the server runs without extensions"
      content:
        application/json:
          schema: { $ref: "schemas/ApiError.schema.json" }
    Log:
      description: The end of the log
      content:
        text/plain:
          schema: { type: string }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "schemas/ApiError.schema.json" }
    Conflict:
      description: "`conflict`: the task is not in a status the call is for (approve and deny: only a task that waits; cancel: not one that ended)"
      content:
        application/json:
          schema: { $ref: "schemas/ApiError.schema.json" }
    BadRequest:
      description: "`bad_request`"
      content:
        application/json:
          schema: { $ref: "schemas/ApiError.schema.json" }
    OAuthError:
      description: An OAuth error
      content:
        application/json:
          schema: { $ref: "schemas/OAuthError.schema.json" }
security:
  - bearer: [ ]
