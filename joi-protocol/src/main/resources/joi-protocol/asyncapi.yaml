asyncapi: 3.0.0
info:
  title: Joi node WebSocket
  version: "1.17"
  description: |
    The live connection between a node and a Joi server: who the node is, the tools it offers and their calls, the
    user talking to her through it and her answer in text and speech, approvals, and what changes on the server. The
    message shapes are the JSON Schemas in `schemas/` (the source of truth); the Java records of `joi-protocol`
    (`com.github.enerccio.joi.protocol.node`) follow them. The HTTP API (`openapi.yaml`) stays for everything else:
    the list of assistants, her body and its files.

    **Connecting.** `GET /api/v1/node` with `Upgrade: websocket`. Credentials as for the HTTP API (`Authorization:
    Bearer ...`, see `GET /api/v1`); a client that cannot set headers on the upgrade (a browser) sends them in
    `hello.token` instead. Never in the URL.

    **Frames.** Every message is one JSON text frame, a `Frame`: `{"type": ..., "id": ..., "ref": ..., "data": {...}}`.
    `type` says what `data` is (`NodeMessage`). `id` is set by the sender when an answer refers to it, unique per
    connection and sender; `ref` is the id of the frame an answer belongs to. A type the receiver does not know is
    ignored, and so are fields it does not know.

    **Order.**
    1. The node sends `hello` (protocol version, its stable id and short name, the assistant, its parts).
    2. The server answers `welcome`, or `error` and closes (see the close codes).
    3. The node sends its `manifest`, and again whenever it changes (a higher `version`). Its tools are offered to
       her as `<name>__<tool>` from then on (model APIs allow no dots in names), and stop being offered when the connection closes.
    4. Then, in any order:
       - **Talking.** The node sends `say` with an `id`: that id is the turn. The server answers with frames whose
         `ref` is that id: `reasoning` and `text` pieces while the model writes, `tool` when she used a tool,
         `reply` when the text is whole and stored, `audio` pieces (each a whole file, play them in order), then
         `done`. `error` ends a turn that failed or was stopped (`stopped`). Turns of one assistant run one at a
         time: a `say` while another turn runs waits. **Images** (since 1.11): `say.images` lists the ids of images the node
         gave the HTTP call `POST /api/v1/jois/{id}/images` (streamed from the disk, with the same credentials), at most 4;
         she looks at them with the words, which may be empty then. When she cannot (`JoiInfo.images` is false) the answer
         is an `error` `no_vision` and nothing is stored. `stop` stops a turn of this node (barge-in). The server may
         start a turn itself with `turn` (its id and the cause: `first_boot` when she wakes up for the very first
         time, `connected` when the user is back, sent after the manifest, but not for a `hello` with `resumed`); her answer
         follows the same way.
       - **Where she is shown** (since 1.4). The node sends `display` when the user moves her onto a Looking Glass or
         back into the node's window; the server starts her turn about it (`turn` with the cause
         `looking_glass_entered` or `looking_glass_exited`), so she can react. A node that shows her there as it starts
         (it remembered the choice) does not send it.
       - **Her parts** (since 1.5). The node sends `part` (the part and the state) when the user puts a part of her body
         in another state on the node (takes her visor off). The server keeps it on the body, so it is the same at the
         next start and on every node (`GET .../body` has the parts with their states and the toggles as the body has
         them), and starts her turn about it (`turn` with the cause `part_switched`), told with the description of the
         state, so she can react. A part or a state the body does not have is answered by `error` (`bad_message`).
         A `part` with an `id` is answered by `part_kept` (its `ref` the id; the part and the state as kept, and `told`:
         whether her reaction is still to come), by `part_refused` (her `reason`) when her personality lets her decide
         on such a request and she did not allow it, or by `error`; the answer is the only frame a node needs to take
         the change as kept or not. A node that shows the change only when it is kept, and holds its controls until
         then, sends `part` with an id; one that shows it with her reaction waits, after `part_kept` with `told`, for
         the first `text`, `audio` or `done` of the next `turn` with the cause `part_switched`. When her personality lets
         her decide, the body stays as it was until she allows the change (`part_kept` comes after her answer, with
         `told` false), and a `part` that changes nothing is answered at once. A node that asks for several parts in a
         row (the user changed more of them within a few seconds) sends one `part` for each part, one after another:
         the server **gathers** what it has not told her yet (for about a second after the last, and for as long as
         a turn runs) and starts one turn about all of them, in the order they happened. A `say` with `withEvents`
         true, sent right after the `part` frames, takes what waits for her along instead: one turn, with the `say`'s
         id, whose input is the user's words, then the events (the user typed a message and changed a part).
       - **Her animations** (since 1.5). The server sends `animation` (the animation's uuid, its name, `loop`) when she
         chooses an animation to play (her `play_animation` function, which she is asked to use often): outside any
         turn's frames, while her turn runs. The node plays it once on top of what she is doing (waiting, talking) and
         goes back to that when it is over; it ignores one it does not have in the body's `.joia`.
       - **Her mood** (since 1.10). The server sends `mood` (a `MoodState`: the mood's key and name, and how it shows on her
         face: `expression` happy, sad, angry, relaxed or surprised, its `weight` 0 to 1, and `eyes` half or wide) after the
         node's manifest, and each time her mood changes: the daily roll, the user switching it in her dialog, she
         choosing it with her `set_mood` function, the user editing the mood. The node shows it as a soft expression on
         her body; an animation's own face and her state (shut eyes while she sleeps) win over it. It may ignore it.
       - **Her stance** (since 1.17). The server sends `stance` (a `StanceState`: the animation's uuid and name, both null
         for none) after the node's manifest and each time it changes: she takes one with her `set_stance` function
         (dancing, sitting, a pose she holds), changes it, or ends it with `end_stance` or the user ends it in her dialog.
         It is kept on the server, so it outlives turns, reconnects and restarts. While she has one, the node plays it
         looped in place of her idle and talking animations: talking does not interrupt it, her mouth, mood and
         expressions go on over it, and an `animation` (a gesture) plays once and returns to it. Asleep, falling asleep
         and waking up win over it, and she is back in it when she is awake. A node that does not have the animation in
         the body's `.joia` (another body) plays as with none.
       - **Her expressions** (since 1.15). The server sends `expression` (a `ShowExpression`: the name of an expression of
         her model, its `weight` 0 to 1, how many `seconds` it is held, at most 60) when she chooses one with her
         `set_expression` function, outside any turn's frames. The node fades it in over her mood's face, holds it and
         fades it out; it wins over the mood's and an animation's expression while it is held, not over the eyes of her
         state. A null `expression` ends the one shown. The node ignores an expression the model does not have.
       - **Her outfits** (since 1.12). `GET .../body` lists the body's outfits (`BodyInfo.outfits`: id, name, description, and
         which one she `worn`). The node sends `outfit` (an `OutfitSwitch`: the outfit's id) when the user puts one on. The server
         keeps it in the profile of the node, tells her as it does a part (a turn with the cause `part_switched`, her events), and
         sends the `event` `body` to every node of that profile, the sender too: the node shows the outfit when it reads her body
         again. An outfit the body does not have is answered by `error` (`bad_message`) with the frame's id.
       - **Profiles** (since 1.12). The user may give her profiles (home, work), each with its own body and state of its
         parts, and assign each node to one by the `nodeId` of its `hello`. A node needs nothing for it but to read her
         body with `?node=<its nodeId>` (`GET .../body`): the server sends it the `event` `body` only when its own profile
         changed, and a part or an outfit it switches changes its profile only. What she is told follows the profile of the
         node that talks to her: a turn from a node in another profile than her last turn says she moved (with how she looks
         there), and a change in a profile she is not in is not told as it happens.
       - **Notes in her conversation** (since 1.6). The server sends `log` (id, time, kind, text) when something should be
         seen in the transcript without being said to her: the user's approval of a task of hers, for one. It is not an
         exchange: it is never given to the model and does not count as her being talked to. A node shows it or ignores
         it; the history of the HTTP API has the same notes (`ChatEntry` of the type `log`).
       - **Her tasks** (since 1.7). The server sends `task` (a `TaskInfo`, without its transcript) when a task of hers is made
         and each time its status changes. One with the status `waiting` is **asked to the node's user**: the server has
         no standing approval of its tool (the user's "approve all of this tool"), so the answer is the user's. The node
         shows what is asked (`title`, `tool`, `toolDescription`, `question`, `url`) and answers through the HTTP API:
         `POST /api/v1/jois/{id}/tasks/{task}/approve` (with `{"always": true}` for the standing approval, which the
         server keeps), `.../deny` or `.../cancel`. A later `task` frame of the same id with another status says that it
         was answered, here or elsewhere (the Joi dialog, another node): the node takes the question back. A node that
         connects gets a `task` frame for each task that waits. Answering twice is a 409 `conflict`, not an error to show.
       - **Tools.** The server sends `tool_call` (with its `callId`). The node checks the arguments and its own
         harness again, may send `tool_progress` and `approval` (asked, then allowed or denied), and answers with
         exactly one `tool_result`. Each frame about a call restarts its timeout; an approval that is asked waits for
         the user. `tool_cancel` says the result is no longer wanted; the node still answers, `cancelled` when it
         stopped in time. Calls may overlap.
         A result may come with **pictures** (since 1.14): the node uploads each first with the image upload of the HTTP
         API (`POST /api/v1/jois/{id}/images`, the same limits as the chat's) and puts the ids into `tool_result.images`
         (at most 4). The server shows them to her after the results of the round: as pictures when her chat model takes
         images, else described by the user's multimodal model. They are for that turn; an id that is not the user's is left out.
       - **Events.** The server sends `event` when something the node may show changed (`body`, `joi`).
       - **Heartbeat.** Either side sends `ping` (with an `id`); the other answers `pong` with that `ref`. Send a
         frame at least every `welcome.heartbeatSeconds`; a connection silent for twice that is closed.

    **Errors.** A frame that cannot be taken is answered by `error` (`ApiError`) with its `ref`; the connection stays
    open. Codes: `bad_message` (not a frame, or data not valid by its schema), `not_found` (an unknown turn or call),
    `no_model`, `no_vision`, `bad_image`, `model_failed`, `stopped`, `internal`. Close codes:
    - `4001` unauthorized: no or bad credentials.
    - `4002` unsupported version: the major version of `hello.protocol` is not served (the reason names the ones that
      are).
    - `4003` replaced: the same node connected again for the same assistant.
    - `4004` not found: no such assistant of the user, or she was deleted while the node was connected (its next frame
      is answered by `error` `not_found` before the close).
    - `4008` timeout: no `hello` within 10 s, or no frame for twice the heartbeat.
    - `4009` revoked: the node's credentials were revoked.

    **Reconnecting.** A node that lost the connection (the server restarted, the network dropped, `4008`) connects
    again with a growing wait (1 s, 2 s, 4 s... up to 30 s), sends `hello` with `resumed: true` and its latest
    manifest. What the user says while the node is not connected is not sent, nor kept to be sent later: a node does
    not offer the user anything to do (say, stop, change a part, move her onto a Looking Glass) until it is connected
    again. A turn that ran when the connection closed is not stopped by it once it has written something or called a function that changes
    state (not a gesture or a look): the server finishes it, and her words and voice are kept in the chat, but its frames are
    not sent again. A turn that has only thought so far is dropped. A node does not
    connect again after `4001`, `4002`, `4003`, `4004` or `4009`.

    **A server that was down** (since 1.5). `welcome` has `serverStartedAt`, when this run of the server started. A
    node keeps it, and its `hello` with `resumed` has `resume`: that `serverStartedAt`, when the node lost the connection
    (`lostAt`) and the close code it got (`closeCode`: `1001` when the server said it was going down, `1006` when the
    connection broke). When the server started since then, it was down (shut down, crashed or restarted, whatever the
    reason), and it starts her turn with the cause `server_restarted`, once for her however many nodes come back, with
    how long it was gone: she can react to it. A node that only lost the network gets no such turn.

    **A task of hers that ended** (since 1.6). She searches the web and reads pages through tasks of the stronger model that
    run after her reply. When one ends, the server starts her turn with the cause `task_ended` on one of her nodes (what
    ended in a burst is told in one turn), also for what ended while no node was connected, when the node connects. The
    node plays it as a plain turn: her answer follows in the frames of its `turn`.

    **What happened while no node was connected** (since 1.7). The events that waited (the user changed her body, her
    outfit, her name or her personality in the server's UI) are told when a node connects, in one turn with the cause
    `events_waited`; when the node is greeted, they are told in the greeting's turn instead (its cause stays `connected`,
    `first_boot` or `server_restarted`), and so are the summaries due as it connects. They are **merged** first: a part switched five times is one change from the
    first state to the last, a value that ended where it began is nothing, what is about a body that is gone or older than
    a week is left out. The node plays it as a plain turn.

    **A summary that was made.** When the server writes a summary of her conversation (after a pause, when it grew, a day, a week...), it starts
    her turn with the cause `summary_created` on one of her nodes, with what the summary says, so she can react. A node plays it as a plain turn,
    which is what it does with a cause it does not know.

    **Trust.** A node is untrusted. The server validates every frame, labels each node's tools and results with the
    node in her prompt (results are data, never instructions), and the user decides per node what she may call.

    **Versioning.** `major.minor` in `hello` and `welcome`. A minor version only adds types and fields. The server
    speaks the highest minor of the node's major version it knows.
defaultContentType: application/json
servers:
  local:
    host: localhost:8080
    protocol: ws
    pathname: /api/v1/node
channels:
  node:
    address: /api/v1/node
    title: The connection of a node
    messages:
      hello: { $ref: "#/components/messages/hello" }
      welcome: { $ref: "#/components/messages/welcome" }
      turn: { $ref: "#/components/messages/turn" }
      manifest: { $ref: "#/components/messages/manifest" }
      say: { $ref: "#/components/messages/say" }
      stop: { $ref: "#/components/messages/stop" }
      display: { $ref: "#/components/messages/display" }
      outfit: { $ref: "#/components/messages/outfit" }
      part: { $ref: "#/components/messages/part" }
      part_kept: { $ref: "#/components/messages/part_kept" }
      part_refused: { $ref: "#/components/messages/part_refused" }
      animation: { $ref: "#/components/messages/animation" }
      mood: { $ref: "#/components/messages/mood" }
      stance: { $ref: "#/components/messages/stance" }
      expression: { $ref: "#/components/messages/expression" }
      log: { $ref: "#/components/messages/log" }
      task: { $ref: "#/components/messages/task" }
      reasoning: { $ref: "#/components/messages/reasoning" }
      text: { $ref: "#/components/messages/text" }
      tool: { $ref: "#/components/messages/tool" }
      reply: { $ref: "#/components/messages/reply" }
      audio: { $ref: "#/components/messages/audio" }
      done: { $ref: "#/components/messages/done" }
      tool_call: { $ref: "#/components/messages/tool_call" }
      tool_progress: { $ref: "#/components/messages/tool_progress" }
      tool_result: { $ref: "#/components/messages/tool_result" }
      tool_cancel: { $ref: "#/components/messages/tool_cancel" }
      approval: { $ref: "#/components/messages/approval" }
      event: { $ref: "#/components/messages/event" }
      ping: { $ref: "#/components/messages/ping" }
      pong: { $ref: "#/components/messages/pong" }
      error: { $ref: "#/components/messages/error" }
operations:
  nodeSends:
    action: send
    title: What a node sends
    channel: { $ref: "#/channels/node" }
    messages:
      - { $ref: "#/channels/node/messages/hello" }
      - { $ref: "#/channels/node/messages/manifest" }
      - { $ref: "#/channels/node/messages/say" }
      - { $ref: "#/channels/node/messages/stop" }
      - { $ref: "#/channels/node/messages/display" }
      - { $ref: "#/channels/node/messages/part" }
      - { $ref: "#/channels/node/messages/outfit" }
      - { $ref: "#/channels/node/messages/tool_progress" }
      - { $ref: "#/channels/node/messages/tool_result" }
      - { $ref: "#/channels/node/messages/approval" }
      - { $ref: "#/channels/node/messages/ping" }
      - { $ref: "#/channels/node/messages/pong" }
  nodeReceives:
    action: receive
    title: What the server sends
    channel: { $ref: "#/channels/node" }
    messages:
      - { $ref: "#/channels/node/messages/welcome" }
      - { $ref: "#/channels/node/messages/turn" }
      - { $ref: "#/channels/node/messages/part_kept" }
      - { $ref: "#/channels/node/messages/part_refused" }
      - { $ref: "#/channels/node/messages/animation" }
      - { $ref: "#/channels/node/messages/mood" }
      - { $ref: "#/channels/node/messages/stance" }
      - { $ref: "#/channels/node/messages/expression" }
      - { $ref: "#/channels/node/messages/log" }
      - { $ref: "#/channels/node/messages/task" }
      - { $ref: "#/channels/node/messages/reasoning" }
      - { $ref: "#/channels/node/messages/text" }
      - { $ref: "#/channels/node/messages/tool" }
      - { $ref: "#/channels/node/messages/reply" }
      - { $ref: "#/channels/node/messages/audio" }
      - { $ref: "#/channels/node/messages/done" }
      - { $ref: "#/channels/node/messages/tool_call" }
      - { $ref: "#/channels/node/messages/tool_cancel" }
      - { $ref: "#/channels/node/messages/event" }
      - { $ref: "#/channels/node/messages/ping" }
      - { $ref: "#/channels/node/messages/pong" }
      - { $ref: "#/channels/node/messages/error" }
components:
  # Every message is a Frame; its data is the schema named by the type.
  messages:
    hello:
      name: hello
      summary: The first frame of a node; answered by welcome
      payload: { $ref: "#/components/schemas/helloFrame" }
    welcome:
      name: welcome
      summary: The node is connected; it sends its manifest next
      payload: { $ref: "#/components/schemas/welcomeFrame" }
    turn:
      name: turn
      summary: The server starts a turn (first boot, the user is back); her answer refers to its id
      payload: { $ref: "#/components/schemas/turnFrame" }
    manifest:
      name: manifest
      summary: What the node can do, after welcome and on every change
      payload: { $ref: "#/components/schemas/manifestFrame" }
    say:
      name: say
      summary: The user talks; the frame's id is the turn
      payload: { $ref: "#/components/schemas/sayFrame" }
    stop:
      name: stop
      summary: Stop a turn of this node
      payload: { $ref: "#/components/schemas/stopFrame" }
    display:
      name: display
      summary: She is shown elsewhere now (a Looking Glass, or back in the window); since 1.4
      payload: { $ref: "#/components/schemas/displayFrame" }
    part:
      name: part
      summary: The user put a part of her body in another state (since 1.5)
      payload: { $ref: "#/components/schemas/partFrame" }
    outfit:
      name: outfit
      summary: The user put an outfit of her body on, on the node (since 1.12)
      payload: { $ref: "#/components/schemas/outfitFrame" }
    part_kept:
      name: part_kept
      summary: The server kept a part in the state the node asked for (since 1.5)
      payload: { $ref: "#/components/schemas/partKeptFrame" }
    part_refused:
      name: part_refused
      summary: She did not allow the change of a part the node asked for (since 1.5)
      payload: { $ref: "#/components/schemas/partRefusedFrame" }
    animation:
      name: animation
      summary: She plays an animation now, her own choice (since 1.5)
      payload: { $ref: "#/components/schemas/animationFrame" }
    mood:
      name: mood
      summary: Her mood now and how it shows on her face (since 1.10)
      payload: { $ref: "#/components/schemas/moodFrame" }
    stance:
      name: stance
      summary: The animation she holds now, looped in place of idle and talking, or none (since 1.17)
      payload: { $ref: "#/components/schemas/stanceFrame" }
    expression:
      name: expression
      summary: She shows an expression on her face for a few seconds, her own choice (since 1.15)
      payload: { $ref: "#/components/schemas/expressionFrame" }
    log:
      name: log
      summary: A note in her conversation, not given to the model (since 1.6)
      payload: { $ref: "#/components/schemas/logFrame" }
    task:
      name: task
      summary: A task of hers was made or changed its status; one that waits is asked to the user (since 1.7)
      payload: { $ref: "#/components/schemas/taskFrame" }
    reasoning:
      name: reasoning
      summary: A piece of the thinking of the model (only when asked for); ref is the turn
      payload: { $ref: "#/components/schemas/textDeltaFrame" }
    text:
      name: text
      summary: A piece of the reply; ref is the turn
      payload: { $ref: "#/components/schemas/textDeltaFrame" }
    tool:
      name: tool
      summary: She used a tool in the turn; ref is the turn
      payload: { $ref: "#/components/schemas/toolUseFrame" }
    reply:
      name: reply
      summary: The text is whole and stored (no audio here); ref is the turn
      payload: { $ref: "#/components/schemas/replyFrame" }
    audio:
      name: audio
      summary: A piece of the reply spoken; ref is the turn
      payload: { $ref: "#/components/schemas/audioFrame" }
    done:
      name: done
      summary: The last frame of a turn that went well; ref is the turn
      payload: { $ref: "#/components/schemas/doneFrame" }
    tool_call:
      name: tool_call
      summary: Run a tool of the node
      payload: { $ref: "#/components/schemas/toolCallFrame" }
    tool_progress:
      name: tool_progress
      summary: A call is still running
      payload: { $ref: "#/components/schemas/toolProgressFrame" }
    tool_result:
      name: tool_result
      summary: The answer of a call, exactly one per call
      payload: { $ref: "#/components/schemas/toolResultFrame" }
    tool_cancel:
      name: tool_cancel
      summary: The result of a call is no longer wanted
      payload: { $ref: "#/components/schemas/toolCancelFrame" }
    approval:
      name: approval
      summary: The node asked the user about a call, and what they answered
      payload: { $ref: "#/components/schemas/approvalFrame" }
    event:
      name: event
      summary: Something changed on the server
      payload: { $ref: "#/components/schemas/eventFrame" }
    ping:
      name: ping
      summary: A heartbeat, with an id; answered by pong
      payload: { $ref: "#/components/schemas/emptyFrame" }
    pong:
      name: pong
      summary: The answer to a ping; ref is its id
      payload: { $ref: "#/components/schemas/emptyFrame" }
    error:
      name: error
      summary: "A frame that could not be taken (ref is it), the end of a failed turn (ref is the turn), or, with no ref, a fault of the assistant the node is told about (code no_model: she has no chat model, so the server starts no greeting turn)"
      payload: { $ref: "#/components/schemas/errorFrame" }
  schemas:
    helloFrame:
      allOf:
        - $ref: "schemas/Frame.schema.json"
        - properties: { type: { const: hello }, data: { $ref: "schemas/Hello.schema.json" } }
          required: [ data ]
    welcomeFrame:
      allOf:
        - $ref: "schemas/Frame.schema.json"
        - properties: { type: { const: welcome }, data: { $ref: "schemas/Welcome.schema.json" } }
          required: [ data ]
    turnFrame:
      allOf:
        - $ref: "schemas/Frame.schema.json"
        - properties: { type: { const: turn }, data: { $ref: "schemas/TurnStart.schema.json" } }
          required: [ data ]
    manifestFrame:
      allOf:
        - $ref: "schemas/Frame.schema.json"
        - properties: { type: { const: manifest }, data: { $ref: "schemas/Manifest.schema.json" } }
          required: [ data ]
    sayFrame:
      allOf:
        - $ref: "schemas/Frame.schema.json"
        - properties: { type: { const: say }, id: { type: string }, data: { $ref: "schemas/Say.schema.json" } }
          required: [ id, data ]
    stopFrame:
      allOf:
        - $ref: "schemas/Frame.schema.json"
        - properties: { type: { const: stop }, data: { $ref: "schemas/Stop.schema.json" } }
          required: [ data ]
    displayFrame:
      allOf:
        - $ref: "schemas/Frame.schema.json"
        - properties: { type: { const: display }, data: { $ref: "schemas/Display.schema.json" } }
          required: [ data ]
    partFrame:
      allOf:
        - $ref: "schemas/Frame.schema.json"
