<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joi</title>
  <style>
    :root {
      --lumo-contrast-5pct: transparent;
      --lumo-secondary-text-color: #9a9aa6;
      --lumo-error-text-color: #ff6b6b;
      --lumo-font-size-m: 16px;
      --lumo-font-family: system-ui, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: #111114; overflow: hidden; }
    joi-model-viewer { width: 100vw; height: 100vh; }
    /* the server is gone: she is frozen (main.js) and gray */
    joi-model-viewer { transition: filter 0.6s; }
    body.offline joi-model-viewer { filter: grayscale(1) brightness(0.7); }
    /* on the Looking Glass: black around her, as the views are */
    body.looking-glass { background: #000; }
  </style>
</head>
<body>
  <joi-model-viewer id="viewer" format="VRM"></joi-model-viewer>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
