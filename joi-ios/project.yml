# The Xcode project of the iOS app, written by XcodeGen (`brew install xcodegen`): `cd joi-ios && xcodegen`. The .xcodeproj is not in Git;
# this file is the source (a capability or a setting is added here, not in Xcode, or the next generation loses it). The app is only a
# shell around JoiApp (Packages/JoiApp), so nearly all of its code builds and is tested with `swift test`.
name: Joi
options:
  bundleIdPrefix: io.github.enerccio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # the signing team comes from the build (`xcodebuild DEVELOPMENT_TEAM=...`, Maven's -Pios) or Xcode's Signing tab, never from here
    CODE_SIGN_STYLE: Automatic
packages:
  JoiApp:
    path: Packages/JoiApp
targets:
  Joi:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Renderer
      # the renderer page, built by Maven (joi-ios/pom.xml) from joi-node/src/main/renderer; a folder, so that its paths stay as they are
      - path: App/Renderer
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - package: JoiApp
        product: JoiApp
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Joi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # the server may be on the local network (http://192.168.x.x): allowed without opening the app to every http address
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Joi connects to your Joi server on the local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.enerccio.joi
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Joi:
    build:
      targets:
        Joi: all
    run:
      config: Debug
    archive:
      config: Release
